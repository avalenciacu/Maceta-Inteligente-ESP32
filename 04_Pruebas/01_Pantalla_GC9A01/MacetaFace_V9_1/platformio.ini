[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -D USER_SETUP_LOADED
    -D GC9A01_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=26
    -D TFT_DC=27
    -D TFT_RST=25
    -D TFT_MISO=-1
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=20000000
